aid: mycase
name: MyCase
description: >-
  MyCase is a cloud-based legal practice and case management platform used by more than 18,000 law firms for matter
  management, contacts and companies, calendaring, events, tasks, documents, time tracking, billing and invoicing,
  payments via LawPay, lead intake, eSignature, and client communications through a secure portal. MyCase was acquired
  by AffiniPay (now 8am, LLC — which also owns LawPay, CasePeer, and Docketwise) in 2022. In late 2023 MyCase released a
  public Open API available exclusively on its Advanced tier, with documentation hosted at mycaseapi.stoplight.io. The
  Open API exposes the firm, cases, contacts, companies, case stages, events, tasks, documents, client relationships,
  and webhook subscriptions, and is positioned as the integration surface for third-party software vendors building on
  MyCase.

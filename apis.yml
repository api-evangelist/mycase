apis:
  - aid: mycase:open-api
    name: MyCase Open API
    description: >-
      The MyCase Open API is a public REST/JSON API that lets MyCase Advanced-tier subscribers and their integration
      partners share data with the MyCase platform, programmatically trigger tasks or events, and build connected
      workflows. The API surface covers the authorized firm, cases, case stages, contacts, companies, client
      relationships, calendar events, tasks, documents and document folders, and time zones. Documentation is hosted on
      Stoplight at mycaseapi.stoplight.io. The API is available only to customers on the Advanced subscription tier;
      access must be requested through MyCase support and certified consultants are listed for implementation
      assistance.
    humanURL: https://mycaseapi.stoplight.io/
    tags:
      - Cases
      - Case Stages
      - Companies
      - Contacts
      - Documents
      - Events
      - Firm
      - Legal
      - Practice Management
      - REST
      - Tasks
    properties:
      - type: Documentation
        url: https://mycaseapi.stoplight.io/docs/mycase-api-documentation/k5xpc4jyhkom7-getting-started
      - type: Reference
        url: https://mycaseapi.stoplight.io/
      - type: Support Article
        url: https://supportcenter.mycase.com/en/articles/9370198-open-api
      - type: OpenAPI
        url: openapi/mycase-open-api-openapi.yml
      - type: GraphQL
        url: graphql/mycase-graphql.md
  - aid: mycase:webhooks
    name: MyCase Webhooks
    description: >-
      MyCase Webhooks deliver event notifications when records change in the MyCase platform (for example case, event,
      task, and document lifecycle events). Webhook subscriptions are documented alongside the Open API on Stoplight and
      are intended for integration partners that need near real-time triggers rather than polling the REST endpoints.
    humanURL: https://mycaseapi.stoplight.io/docs/mycase-api-documentation/fdtu5r8u47pku-webhooks
    tags:
      - Events
      - Legal
      - Notifications
      - Webhooks
    properties:
      - type: Documentation
        url: https://mycaseapi.stoplight.io/docs/mycase-api-documentation/fdtu5r8u47pku-webhooks

  name: MyCase Webhooks
  description: >-
    MyCase Webhooks deliver event notifications when records change in the MyCase platform (for example
    case, event, task, and document lifecycle events). Webhook subscriptions are documented alongside
    the Open API on Stoplight and are intended for integration partners that need near real-time triggers
    rather than polling the REST endpoints.

  eventTypes: [WebhookEventType!]
}

input CreateLeadInput {
  firstName: String
  lastName: String
  email: String
  phone: String
  source: String
  practiceArea: String
  notes: String
  assignedUserId: ID
}

input UpdateLeadInput {
  firstName: String
  lastName: String
  email: String
  phone: String
  status: LeadStatus
  source: String
  practiceArea: String
  notes: String
  assignedUserId: ID
}

input PaginationInput {
  first: Int
  after: String
  last: Int
  before: String
}

# ──────────────────────────────────────────────
# Query Root
# ──────────────────────────────────────────────

type Query {
  # Firm
  firm: Firm!

  # Users
  users: [User!]!
  user(id: ID!): User

  # Case Stages
  caseStages: [CaseStage!]!
  caseStage(id: ID!): CaseStage

  # Cases
  cases(filter: CaseFilterInput, pagination: PaginationInput, sortBy: String, sortOrder: SortOrder): CaseConnection!
  case(id: ID!): Case
  casesByClient(clientId: ID!): [Case!]!

  # Contacts
  contacts(searchQuery: String, type: ContactType, pagination: PaginationInput): ContactConnection!
  contact(id: ID!): Contact

  # Companies
  companies(searchQuery: String, pagination: PaginationInput): [Company!]!
  company(id: ID!): Company

  # Events
  events(filter: EventFilterInput, pagination: PaginationInput): [Event!]!
  event(id: ID!): Event

  # Tasks
  tasks(filter: TaskFilterInput, pagination: PaginationInput): TaskConnection!
  task(id: ID!): Task

  # Documents
  documents(caseId: ID, pagination: PaginationInput): DocumentConnection!
  document(id: ID!): Document
  caseDocumentsFolder(caseId: ID!): DocumentFolder

  # Time Entries
  timeEntries(filter: TimeEntryFilterInput, pagination: PaginationInput): TimeEntryConnection!
  timeEntry(id: ID!): TimeEntry

  # Expenses
  expenses(caseId: ID, isBilled: Boolean, pagination: PaginationInput): [Expense!]!
  expense(id: ID!): Expense

  # Invoices
  invoices(filter: InvoiceFilterInput, pagination: PaginationInput): InvoiceConnection!
  invoice(id: ID!): Invoice

  # Payments
  payments(invoiceId: ID, clientId: ID, pagination: PaginationInput): PaymentConnection!
  payment(id: ID!): Payment

  # Notes
  notes(caseId: ID, contactId: ID): [Note!]!
  note(id: ID!): Note

  # Communication Threads
  communicationThreads(caseId: ID, contactId: ID): [CommunicationThread!]!
  communicationThread(id: ID!): CommunicationThread

  # Leads
  leads(status: LeadStatus, assignedUserId: ID): [Lead!]!
  lead(id: ID!): Lead

  # Webhooks
  webhookSubscriptions: [WebhookSubscription!]!
  webhookSubscription(id: ID!): WebhookSubscription

  # Time Zones
  timeZones: [TimeZone!]!

  # Tags
  tags: [Tag!]!
}

# ──────────────────────────────────────────────
# Mutation Root
# ──────────────────────────────────────────────

type Mutation {
  # Cases
  createCase(input: CreateCaseInput!): Case!
  updateCase(id: ID!, input: UpdateCaseInput!): Case!
  closeCase(id: ID!, closedAt: Date): Case!
  deleteCase(id: ID!): Boolean!

  # Client Relationships
  createClientRelationship(caseId: ID!, input: CreateClientRelationshipInput!): ClientRelationship!
  deleteClientRelationship(id: ID!): Boolean!

  # Contacts
  createContact(input: CreateContactInput!): Contact!
  updateContact(id: ID!, input: UpdateContactInput!): Contact!
  deleteContact(id: ID!): Boolean!

  # Companies
  createCompany(name: String!, primaryEmail: String, primaryPhone: String, address: AddressInput, website: String): Company!
  updateCompany(id: ID!, name: String, primaryEmail: String, primaryPhone: String, address: AddressInput, website: String): Company!
  deleteCompany(id: ID!): Boolean!

  # Events
  createEvent(input: CreateEventInput!): Event!
  updateEvent(id: ID!, input: UpdateEventInput!): Event!
  deleteEvent(id: ID!): Boolean!

  # Tasks
  createTask(input: CreateTaskInput!): Task!
  updateTask(id: ID!, input: UpdateTaskInput!): Task!
  completeTask(id: ID!): Task!
  deleteTask(id: ID!): Boolean!

  # Documents
  uploadDocument(caseId: ID!, file: Upload!, name: String, folderId: ID): Document!
  updateDocument(id: ID!, name: String, folderId: ID, description: String): Document!
  deleteDocument(id: ID!): Boolean!
  createDocumentFolder(caseId: ID!, name: String!, parentFolderId: ID): DocumentFolder!

  # Time Entries
  createTimeEntry(input: CreateTimeEntryInput!): TimeEntry!
  updateTimeEntry(id: ID!, input: UpdateTimeEntryInput!): TimeEntry!
  deleteTimeEntry(id: ID!): Boolean!

  # Expenses
  createExpense(caseId: ID, description: String!, date: Date!, amount: Float!, isBillable: Boolean): Expense!
  updateExpense(id: ID!, description: String, date: Date, amount: Float, isBillable: Boolean): Expense!
  deleteExpense(id: ID!): Boolean!

  # Invoices
  createInvoice(input: CreateInvoiceInput!): Invoice!
  updateInvoice(id: ID!, input: UpdateInvoiceInput!): Invoice!
  sendInvoice(id: ID!): Invoice!
  voidInvoice(id: ID!): Invoice!
  deleteInvoice(id: ID!): Boolean!

  # Payments
  recordPayment(input: RecordPaymentInput!): Payment!
  voidPayment(id: ID!): Payment!

  # Notes
  createNote(caseId: ID, contactId: ID, content: String!, isPinned: Boolean): Note!
  updateNote(id: ID!, content: String, isPinned: Boolean): Note!
  deleteNote(id: ID!): Boolean!

  # Communication Threads
  createCommunicationThread(caseId: ID, contactId: ID, subject: String): CommunicationThread!
  sendMessage(threadId: ID!, content: String!, attachmentDocumentIds: [ID!]): Message!
  markMessageRead(messageId: ID!): Message!

  # Leads
  createLead(input: CreateLeadInput!): Lead!
  updateLead(id: ID!, input: UpdateLeadInput!): Lead!
  convertLead(id: ID!, createCase: Boolean): Lead!
  deleteLead(id: ID!): Boolean!

  # Webhooks
  createWebhookSubscription(input: CreateWebhookInput!): WebhookSubscription!
  updateWebhookSubscription(id: ID!, input: UpdateWebhookInput!): WebhookSubscription!
  deleteWebhookSubscription(id: ID!): Boolean!
}
